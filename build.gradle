// Top-level build file where you can add configuration options common to all sub-projects/modules

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

// Add the QEMU version to the APK name, fallback to none when unspecified
ext.qemuVersion = project.findProperty('qemuVersion') ?: System.getenv('QEMU_VERSION') ?: 'none'
ext.ndkVersion = '30.0.16248370'

allprojects {
    repositories {
        google()
        mavenCentral()
    }

//    gradle.projectsEvaluated {
//        tasks.withType(JavaCompile) {
//            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
//        }
//    }

}

task clean(type: Delete) {
    delete rootProject.buildDir
}

apply plugin: 'idea'
idea {
  module {
//Exclude C source code from indexing
    excludeDirs.add(file('qube-android-lib/src/main/jni'))
    excludeDirs.add(file('qube-android-lib/build'))
    excludeDirs.add(file('qube-android-arm/build'))
    excludeDirs.add(file('qube-android-ppc/build'))
    excludeDirs.add(file('qube-android-x86/build'))
    excludeDirs.add(file('gradle'))	
  }
}
